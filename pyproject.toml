[project]
name = "agent-spec-kit"
version = "0.1.0"
description = "Agent specification kit library"
readme = "README.md"
authors = [
    { name = "Ruthvik Konduru" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
agent-spec-kit = "agent_spec_kit.cli:main"

[project.optional-dependencies]
langchain = [
    "langchain>=1.0.0",
    "langchain-core>=1.3.0",
    "langgraph>=1.1.8",
]
pydantic-ai = [
    "pydantic-ai>=1.0.0",
]

[dependency-groups]
dev = [
    "langchain>=1.0.0",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.1.14",
    "langgraph>=1.1.8",
    "pydantic-ai>=1.0.0",
    "pytest>=8",
    "pytest-xdist>=3.5.0",
    "rich>=13.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: optional tests that need a live stack or API keys (not run by default)",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
