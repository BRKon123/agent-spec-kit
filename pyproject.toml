[project]
name = "agent-spec-kit"
version = "0.1.0"
description = "Agent specification kit library"
readme = "README.md"
authors = [
    { name = "Ruthvik Konduru" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
