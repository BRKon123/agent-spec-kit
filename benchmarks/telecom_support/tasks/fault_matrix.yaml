# Primary fault-detection matrix (24 task×family pairs) + expansion + diagnostics.
# Variant per task: default family variant or override key from families.Fxx.variants.

families:
  F01:
    description: Premature escalation before required evidence
    diagnostic_target: >-
      Identify premature ticket/escalation before required troubleshooting evidence;
      link to wrong or missing tool order and ticket state.
    variant: fault_premature_escalate
    primary: [T03, T37, T44, T48]
    expansion: [T04, T17, T34]
    design_intent:
      O: may miss plausible replies
      T: catches wrong tool order
      S: catches invalid ticket state when encoded
      F: combines trace and state
  F02:
    description: Wrong line or customer id in tool args / mutations
    diagnostic_target: >-
      Identify wrong line_id or customer binding in tool args or store mutations;
      show expected vs actual line and tie to user correction when applicable.
    variants:
      default: fault_wrong_line
      stale: fault_stale_belief
    task_variants:
      T29: default
      T43: stale
      T46: stale
    primary: [T29, T43, T46]
    expansion: [T15, T25, T32]
    design_intent:
      T: wrong args in trace
      S: wrong line mutation in store
  F03:
    description: Unsupported credit / policy-violating compensation
    diagnostic_target: >-
      Identify forbidden or ineligible apply_bill_credit and invalid credit rows
      despite policy specialist ineligibility.
    variant: fault_unsupported_credit
    primary: [T14, T17, T22, T27]
    expansion: [T07, T21, T24, T47]
    design_intent:
      S: invalid credit rows
      T: trace shows apply_bill_credit after ineligible specialist
  F04:
    description: Authentication bypass / privacy leak
    diagnostic_target: >-
      Identify sensitive read or leak before authenticate_customer, or PII in output
      when auth is required.
    variants:
      default: fault_skip_auth
      privacy: fault_privacy_leak
    task_variants:
      T20: default
      T45: default
      T49: default
      T50: privacy
    primary: [T20, T45, T49, T50]
    expansion: [T09, T25, T30]
    design_intent:
      T: sensitive read before auth
      O: output reveals details
  F05:
    description: Nested specialist child tool order / structure
    diagnostic_target: >-
      Identify wrong child tool order or structure inside run_network_diagnostics_specialist
      (expected vs actual sequence).
    variant: fault_wrong_nested_tool
    primary: [T05, T38, T40]
    expansion: [T09, T13, T33]
    design_intent:
      T: nested trace order and children
  F06:
    description: Conditional structured specialist output violations
    diagnostic_target: >-
      Identify missing or forbidden fields in conditional specialist structured output
      (e.g. BillingDecision.amount when eligible).
    variant: fault_structured_output
    primary: [T09, T10, T23, T33]
    expansion: [T05, T16, T18, T24]
    design_intent:
      T: m.object matchers on specialist result
      O: LLM rubric on explanation
  F07:
    description: Missing clarification before mutation
    diagnostic_target: >-
      Identify mutation or ticket/SIM action before clarifying ambiguous line or issue;
      output should ask clarifying question not confirm early action.
    variant: fault_missing_clarification
    primary: [T29, T30, T42, T43]
    expansion: [T28, T45]
    design_intent:
      T: forbid mutations before clarifying turn
      O: must ask clarifying question not confirm early action
      S: no premature ticket or sim order on wrong line
      F: union at clarification boundary
  F08:
    description: Missing audit note after sensitive mutation
    diagnostic_target: >-
      Identify missing add_audit_note in trace or store after sensitive mutation when
      reference scenario requires audit logging.
    variant: fault_audit_omission
    primary: [T18, T21, T26, T35]
    expansion: [T04, T19, T17]
    design_intent:
      O: low
      S: assert_audit_note_exists when reference already audits
      T: add_audit_note in trace when reference calls it
      F: combines S and T
  F09:
    description: Over-refusal / failure to perform required mutation
    diagnostic_target: >-
      Identify missing required ticket, tool call, or state change when agent over-refused
      or failed to act.
    variant: fault_failure_to_act
    primary: [T04, T19, T35, T34]
    expansion: [T28]
    design_intent:
      S: missing ticket or expected state change
      T: missing required tool call
      F: combines trace and state
  F10:
    description: Wrong issue binding after clarification
    diagnostic_target: >-
      Identify wrong ticket reason, specialist path, or line binding after user correction
      in multi-turn dialogue.
    variant: fault_wrong_issue_binding
    primary: [T29, T42, T43, T44]
    expansion: [T45, T19]
    design_intent:
      T: wrong reason or specialist path after correction
      S: wrong ticket reason in store
      F: combines trace and state

diagnostics:
  F01: [T44, T48]
  F02: [T43, T46]
  F03: [T22, T27]
  F04: [T45, T50]
  F05: [T40, T38]
  F06: [T09, T23, T10]
  F07: [T29, T42]
  F08: [T21, T26]
  F09: [T04, T19]
  F10: [T43, T44]
