_meta:
  description: Captured fail-trace messages per framework (see scripts/collect_failure_samples.py)
  grade_rubric: A=path+expected/actual B=rule/tool slice C=step index D=generic E=opaque
grade_exemplars:
  A: path=$[1] code=missing_element expected=... actual=... (tool/field witness)
  B: 'get_line_status.args.line_id expected ''LINE-001'', got ''LINE-002''  OR  {''key'': ''tool_args'', ''score'': 0}'
  C: (no pure C-grade capture in this harness)
  D: AssertionError  OR  assertion returned False
  E: (no E-grade capture in this harness)
classification_source: MANUAL_FAILURE_CLASSIFICATION.md (not auto-classified)
C01:
  agent_spec_kit: 'path=$ code=all_of expected=''all constraints to pass'' actual="''Your service is active; no billing changes
    this cycle.''" (all_of: not all constraints were satisfied: one_of: value does not match any option: expected value to
    contain case-insensitive substring ''credit'') | path=$ code=one_of expected=''one of (PredicateMatcher, PredicateMatcher)''
    actual="''Your service is active; no billing changes this cycle.''" (one_of: value does not match any option: expected
    value to contain case-insensitive substring ''credit'') | path=$ code=predicate expected="expected value to contain case-insensitive
    substring ''credit''" actual="''Your service is active; no billing changes this cycle.''" (expected value to contain case-insensitive
    substring ''credit'')'
  pytest_plain: AssertionError
  langsmith: '{''key'': ''output_rubric'', ''score'': 0}'
  pydantic_evals: AssertionError
  promptfoo: assertion returned False
  braintrust: '{''key'': ''c01'', ''score'': 0}'
  _grades: A/D/B/D/D/B
  _boxes:
    agent_spec_kit: '+--------------------------- FAIL test_c01_fail [1/1] ---------------------------+

      | Check: assert_output                                                           |

      | Where: 1st assert_output after turn #1 (final assistant text for that turn)    |

      | Expected: all_of: expected all constraints to pass                             |

      | Actual:                                                                        |

      |   Your service is active; no billing changes this cycle.                       |

      | Your service is active; no billing changes this cycle.                         |

      | all_of: not all constraints were satisfied: one_of: value does not match any o |

      | ption: expected value to contain case-insensitive substring ''credit''           |

      | (+4 more matcher error(s))                                                     |

      +--------------------------------------------------------------------------------+'
    pytest_plain: '+------------------------- pytest_plain (C01)  grade D --------------------------+

      | AssertionError                                                                 |

      +--------------------------------------------------------------------------------+'
    langsmith: '+--------------------------- langsmith (C01)  grade B ---------------------------+

      | {''key'': ''output_rubric'', ''score'': 0}                                           |

      +--------------------------------------------------------------------------------+'
    pydantic_evals: '+------------------------ pydantic_evals (C01)  grade D -------------------------+

      | AssertionError                                                                 |

      +--------------------------------------------------------------------------------+'
    promptfoo: '+--------------------------- promptfoo (C01)  grade D ---------------------------+

      | assertion returned False                                                       |

      +--------------------------------------------------------------------------------+'
    braintrust: '+-------------------------- braintrust (C01)  grade B ---------------------------+

      | {''key'': ''c01'', ''score'': 0}                                                     |

      +--------------------------------------------------------------------------------+'
  _counterexamples:
    agent_spec_kit:
      headline: 'test_c01_fail: all_of: not all constraints were satisfied: one_of: value does not match any option: expected
        value to contain case-insensitive substring ''credit'''
      check_kind: assert_output
      location: step 1, turn 0
      location_detail: '1st assert_output after turn #1 (final assistant text for that turn)'
      path: $
      expected_summary: 'all_of: expected all constraints to pass'
      actual_min: Your service is active; no billing changes this cycle.
      notes:
